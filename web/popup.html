<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>translate</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafbf8;
    --border: #dce5db;
    --text: #29372f;
    --accent: #3b7560;
    --hover: #e8f0e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #232d27; --border: #344438; --text: #e3eae2;
      --accent: #9bceb0; --hover: #314c3b;
    }
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    cursor: default;
    user-select: none;
  }
  .bar {
    position: fixed; inset: 4px;
    display: flex; align-items: center; gap: 2px;
    padding: 0 6px 0 5px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 2px 5px rgba(35, 61, 48, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(14px) saturate(150%);
  }
  .badge {
    flex: 0 0 auto;
    width: 23px; height: 23px; margin-right: 3px;
    display: grid; place-items: center;
    font-size: 12.5px; font-weight: 600; color: var(--bg);
    border-radius: 7px;
    background: var(--accent);
  }
  button {
    flex: 1 1 0;
    min-width: 0;
    height: 30px;
    padding: 0 9px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 12px; font-weight: 500; line-height: 1;
    font-family: inherit;
    color: var(--text);
    white-space: nowrap;
    background: transparent;
    border: 0; border-radius: 8px;
    cursor: pointer;
    transition: background 90ms ease, transform 60ms ease;
  }
  button:hover { background: var(--hover); }
  button:active { background: var(--hover); transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  button .gl {
    font-size: 13px; font-weight: 600;
    color: var(--accent);
  }
  .sep {
    flex: 0 0 auto;
    width: 1px; height: 18px; margin: 0 2px;
    background: var(--border);
  }
</style>
<script src="themes.js"></script>
</head>
<body>
  <div class="bar">
    <span class="badge" id="badge" title="选中文本翻译">译</span>
    <button id="btn-zh" data-dir="zh" title="Translate the selection into Chinese">
      <span class="gl">中</span>Translate into Chinese
    </button>
    <span class="sep"></span>
    <button id="btn-en" data-dir="en" title="Translate the selection into English">
      <span class="gl">EN</span>Translate into English
    </button>
  </div>

<script>
  const badge = document.getElementById('badge');
  let apiReady = false;

  function callApi(method, arg) {
    if (window.pywebview && window.pywebview.api) {
      const fn = window.pywebview.api[method];
      if (typeof fn === 'function') {
        // Only pass an argument when we have one: pywebview forwards undefined
        // as a real argument, which breaks parameterless Python methods.
        return arguments.length > 1 ? fn(arg) : fn();
      }
    }
    return null;
  }

  for (const btn of document.querySelectorAll('button[data-dir]')) {
    btn.addEventListener('click', () => {
      const dir = btn.dataset.dir;
      btn.disabled = true;
      callApi('action', dir);
    });
  }

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') callApi('dismiss');
  });

  window.addEventListener('pywebviewready', () => { apiReady = true; });

  // Called from Python before the popup is shown.
  window.__app = {
    setPreview(text) {
      const clean = String(text || '').replace(/\s+/g, ' ').trim();
      badge.title = clean.length > 160 ? clean.slice(0, 160) + '…' : clean;
      for (const btn of document.querySelectorAll('button[data-dir]')) btn.disabled = false;
    },
    focusBar() {
      for (const btn of document.querySelectorAll('button[data-dir]')) btn.disabled = false;
    }
  };
</script>
</body>
</html>
